<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Looped Brain 3D</title>
<style>
:root {
  --bg: #0d1117; --bg2: #151b24; --panel: #161c26; --line: #2a3442; --text: #e6edf3; --muted: #8b98a8;
  --accent: #58a6ff; --chip: #1f2733; --shadow: 0 6px 24px rgba(0,0,0,.45);
  --c-input: #3ddc97; --c-forward: #4fa3ff; --c-memory: #c77dff; --c-output: #ffb347; --c-disabled: #8a8f98;
  --e-forward: #4fa3ff; --e-loop: #2ee6d6; --e-memory: #c77dff; --e-loss: #ff7b72;
}
:root[data-theme="light"] {
  --bg: #f4f6f9; --bg2: #ffffff; --panel: #ffffff; --line: #d5dbe3; --text: #1b2430; --muted: #5d6b7c;
  --accent: #0b63ce; --chip: #eef2f7; --shadow: 0 6px 24px rgba(20,30,50,.15);
  --c-input: #138a5b; --c-forward: #1f6fd1; --c-memory: #8a3ccf; --c-output: #c27500; --c-disabled: #7a808a;
  --e-forward: #1f6fd1; --e-loop: #0a9b8f; --e-memory: #8a3ccf; --e-loss: #d23b3b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
button, input { font: inherit; color: inherit; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg2);
  border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
header h1 { font-size: 15px; margin: 0 8px 0 0; white-space: nowrap; }
header h1 small { color: var(--muted); font-weight: 400; }
.btn { background: var(--chip); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.group .lab { color: var(--muted); font-size: 12px; margin-right: 2px; }
.tog { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--chip); cursor: pointer; font-size: 12.5px; user-select: none; }
.tog input { margin: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
#searchWrap { position: relative; }
#search { width: 210px; padding: 4px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); }
#results { position: absolute; top: 32px; left: 0; width: 320px; max-height: 340px; overflow: auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); display: none; z-index: 20; }
#results div { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
#results div:hover, #results div.act { background: var(--chip); }
#results small { color: var(--muted); display: block; }
main { position: absolute; top: var(--hdr, 92px); left: 0; right: 0; bottom: 0; }
#view3d, #view2d { position: absolute; inset: 0; z-index: 1; }
#view3d canvas { display: block; }
#labels3d { position: absolute; inset: 0; pointer-events: none; }
.nl { pointer-events: auto; cursor: pointer; padding: 1px 6px; border-radius: 6px; font-size: 10.5px; white-space: nowrap;
  background: color-mix(in srgb, var(--bg2) 82%, transparent); border: 1px solid var(--line); color: var(--text);
  transform: translateY(-16px); }
.nl.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.nl.dim { opacity: .28; }
.nl.disabled { border-style: dashed; color: var(--muted); }
.el { font: 10.5px ui-monospace, Consolas, monospace; color: var(--text); background: color-mix(in srgb, var(--bg) 85%, transparent);
  padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; pointer-events: none; }
.planeLab { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; pointer-events: none; }
#fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
  color: var(--muted); padding: 24px; }
#view2d { display: none; }
#svg2d { width: 100%; height: 100%; cursor: grab; touch-action: none; }
#svg2d.drag { cursor: grabbing; }
.n2 rect { stroke-width: 1.4; rx: 8; }
.n2 text { font-size: 12px; fill: var(--text); pointer-events: none; }
.n2 { cursor: pointer; }
.n2.dim { opacity: .22; }
.n2.sel rect { stroke: var(--accent) !important; stroke-width: 3; }
.e2 { fill: none; stroke-width: 1.6; opacity: .75; }
.e2.dim { opacity: .08; }
.e2.hl { stroke-width: 2.6; opacity: 1; }
.e2lab { font: 10.5px ui-monospace, Consolas, monospace; fill: var(--text); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.band { opacity: .06; }
.bandLab { font-size: 15px; font-weight: 700; fill: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
@keyframes dash { to { stroke-dashoffset: -24; } }
.e2.anim { stroke-dasharray: 6 6; animation: dash 1s linear infinite; }
#panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(440px, 42vw); background: var(--panel);
  border-left: 1px solid var(--line); overflow: auto; padding: 14px 16px 30px; transform: translateX(100%);
  transition: transform .2s ease; z-index: 6; box-shadow: var(--shadow); }
#panel.open { transform: none; }
#panel h2 { margin: 0 26px 4px 0; font-size: 18px; }
#panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
#panel .close { position: absolute; right: 10px; top: 10px; }
#panel p { margin: 6px 0; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px; color: #fff; margin-right: 4px; }
.eq { font: 12px/1.5 ui-monospace, Consolas, monospace; background: var(--chip); border: 1px solid var(--line);
  border-radius: 7px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
table.kv { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.kv td { border-bottom: 1px solid var(--line); padding: 4px 4px; vertical-align: top; }
table.kv td:first-child { color: var(--muted); width: 42%; }
.io { border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; margin: 5px 0; font-size: 12.5px; }
.io a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 600; }
.io code { font: 11.5px ui-monospace, Consolas, monospace; display: block; color: var(--muted); }
.io .k { float: right; font-size: 11px; color: var(--muted); }
.navbtns { display: flex; flex-wrap: wrap; gap: 5px; }
.navbtns .btn { font-size: 12px; padding: 3px 8px; }
code.file { font: 11.5px ui-monospace, Consolas, monospace; display: block; color: var(--muted); }
#legend { position: absolute; left: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 9px; padding: 8px 10px; font-size: 12px; z-index: 4; max-width: 280px; box-shadow: var(--shadow); }
#legend h4 { margin: 2px 0 4px; font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
#legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
#legend .sw { width: 22px; height: 0; border-top: 3px solid; }
#legend .sw.dash { border-top-style: dashed; }
#legend.min .body { display: none; }
@media (max-height: 760px) { #legend .body .hint { display: none; } }
#legendToggle { cursor: pointer; font-size: 11px; color: var(--accent); float: right; margin-left: 10px; }
#walk { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; width: min(680px, 94vw);
  background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; display: none;
  z-index: 7; box-shadow: var(--shadow); }
#walk .txt { margin: 4px 0 8px; }
#walk .bar { display: flex; gap: 6px; align-items: center; }
#walk .step { color: var(--muted); font-size: 12px; margin-left: auto; }
#runinfo { position: absolute; right: 10px; bottom: 10px; font-size: 11.5px; color: var(--muted); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; z-index: 3; max-width: 330px; }
@media (max-width: 820px) {
  #panel { width: 100%; top: auto; height: 58%; border-left: 0; border-top: 1px solid var(--line); transform: translateY(100%); }
  #panel.open { transform: none; }
  #search { width: 150px; }
  #runinfo { display: none; }
  #legend { max-width: 200px; }
}
</style>
</head>
<body>
<header id="hdr">
  <h1>Looped brain <small>world_mem_life_12k</small></h1>
  <div class="group"><button class="btn on" id="tab3d">3D</button><button class="btn" id="tab2d">2D overview</button></div>
  <div id="searchWrap"><input id="search" placeholder="Search modules, flags…" autocomplete="off"><div id="results"></div></div>
  <div class="group" id="layerToggles"><span class="lab">Layers</span></div>
  <div class="group"><span class="lab">Paths</span>
    <label class="tog"><input type="checkbox" id="togBack" checked>Loss paths</label>
    <label class="tog"><input type="checkbox" id="togAnim" checked>Animate</label>
    <label class="tog"><input type="checkbox" id="togShapes">All edge shapes</label>
  </div>
  <div class="group" id="flowBtns"><span class="lab">Highlight</span></div>
  <div class="group">
    <button class="btn" id="walkBtn">Follow one token</button>
    <button class="btn" id="resetBtn">Reset view</button>
    <button class="btn" id="themeBtn">Light</button>
  </div>
</header>
<main id="main">
  <div id="view3d"><div id="labels3d"></div><div id="fallback"></div></div>
  <div id="view2d"><svg id="svg2d" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="legend"><h4>Legend <span id="legendToggle">hide</span></h4><div class="body" id="legendBody"></div></div>
  <div id="runinfo"></div>
  <aside id="panel"><button class="btn close" id="panelClose">✕</button><div id="panelBody"></div></aside>
  <div id="walk"><div class="txt" id="walkTxt"></div><div class="bar">
    <button class="btn" id="walkPrev">◀ Prev</button><button class="btn" id="walkPlay">Play</button>
    <button class="btn" id="walkNext">Next ▶</button><button class="btn" id="walkClose">Close</button>
    <span class="step" id="walkStep"></span></div></div>
</main>

:"loss","label":"","shape_sym":"","shape_num":"","note":""},{"id":"e70","source":"loss_z","target":"loss_total","kind":"loss","label":"","shape_sym":"","shape_num":"","note":""}],"walkthrough":[{"node":"tokens","text":"Follow one token: take the word at batch 0, position t = 300 (one of the trace words of the loop report). It arrives as one id in idx (16, 512)."},{"node":"embedding","text":"It is looked up: e_t is a 384-vector. x_0 = e. The same e is re-added on every pass."},{"node":"ws_init","text":"Its private workspace starts at s_0 = tanh(W_0 n_e(e_t)): 16 slots x 64."},{"node":"pass1","text":"Pass 1 begins (eval: K = 6; training: K random 2-10). Head group 0 + group 1 are on."},{"node":"ws_read","text":"The thought x_t queries its 16 slots (softmax over slots) and reads a 64-d summary back."},{"node":"input_mix","text":"u_t = n_u(x_t + n_e(e_t) + W_ro r_t + inject_t). On pass 1 inject is empty (read0 off)."},{"node":"membranes","text":"The SSD heads scan all 512 words: token t now carries context from words 0..t (graded spikes)."},{"node":"waves","text":"Its router logits get excitation from the experts it used on the previous pass (from pass 2 on) minus fatigue."},{"node":"router","text":"The router scores up to 768 experts and picks 6 (training: noise 0.3 on the choice)."},{"node":"experts","text":"Token t is packed into those 6 experts' capacity buffers (C = 96 at E = 768) and computed; the shared expert always runs. From pass 2 on its 6 experts also read 4 private rows each."},{"node":"ws_write","text":"c_t = m_t + o_t is written into the 16 slots, each with its own gate."},{"node":"x_update","text":"x_t ← n_x(x_t + α((1−λ)(m+o) + λ W_xo s_t)): the new thought."},{"node":"concepts","text":"After the pass, 4 concept heads read the workspace and predict where the text goes over the next 16/32/64/128 tokens."},{"node":"uncertainty","text":"Their vagueness and movement u_t (8 numbers) go back into every slot and to the halting head."},{"node":"translator","text":"Memory: a_l = [μ_l ; p̄_t] per level, standardised."},{"node":"wq","text":"A fixed random W_q turns it into a 128-d query per head, split in two 64-d halves."},{"node":"pk_select","text":"Each half picks its top-8 of 512 sub-keys; the best 6 of the 64 pairs are this token's rows out of 262,144 per level (ranks 7-12 get neighbour writes)."},{"node":"shared_pool","text":"6 rows x 12 heads are read (plus 6 coarse rows per level), weighted by softmax(σ/0.03) and their decay."},{"node":"mem_gates","text":"Each head's read is gated by σ(w·[p̄; r] + b) and summed per level."},{"node":"w_o","text":"W_o maps the 4 levels' reads to M_t (384)."},{"node":"write_back","text":"Next-pass input: inject_t = Σ_l B_l A_l μ_l + M_t; and slot 15 gets W_ms M_t."},{"node":"pass2","text":"Pass 2 runs the SAME weights with head group 2 ... the loop repeats (reads after passes 1-4 address anew, after pass 5 they reuse)."},{"node":"pass_readout","text":"Training: after every pass the LM head reads x_t (deep supervision 0.3 inside the BPTT window)."},{"node":"halt_head","text":"The halting head estimates whether token t can stop (eval: stop at cumulative 0.5)."},{"node":"final_norm","text":"After pass K: normf(x_K) - also the stop-gradient target of the concept heads."},{"node":"lm_head","text":"W_lm gives 16,384 logits: the prediction of token t+1."},{"node":"logits","text":"Logits (16, 512, 16384): token t's row is its distribution over the next token."},{"node":"loss_lm","text":"Next-token loss: −log p(y_t), y_t = token t+1. This is the main training signal."},{"node":"loss_total","text":"Total: L_LM + 0.3 deep supervision + halt + 0.1 concept + 0.02 balance + 1e-4 z (the memory rows token t read are later written by MemOpt during learning)."}],"checkpoint_shapes":{"step":2000,"shapes":{"emb.weight":[16384,384],"blocks.0.alpha":[384],"blocks.0.router_conn":[311,311],"blocks.0.wave_gamma":[],"blocks.0.wave_beta":[],"blocks.0.ws_mix":[384],"blocks.0.pos":[311,2],"blocks.0.adj2":[311,311],"blocks.0.n_u.weight":[384],"blocks.0.n_t.weight":[384],"blocks.0.n_m.weight":[384],"blocks.0.n_x.weight":[384],"blocks.0.n_e.weight":[384],"blocks.0.mix.A_log":[12],"blocks.0.mix.dt_bias":[12],"blocks.0.mix.Dskip":[12],"blocks.0.mix.norm_w":[12,64],"blocks.0.mix.hgroup":[12],"blocks.0.mix.ramp":[768],"blocks.0.mix.wz.weight":[768,384],"blocks.0.mix.wx.weight":[768,384],"blocks.0.mix.wq.weight":[768,384],"blocks.0.mix.wk.weight":[768,384],"blocks.0.mix.wdt.weight":[12,384],"blocks.0.mix.cx.weight":[768,4],"blocks.0.mix.cx.bias":[768],"blocks.0.mix.cq.weight":[768,4],"blocks.0.mix.cq.bias":[768],"blocks.0.mix.ck.weight":[768,4],"blocks.0.mix.ck.bias":[768],"blocks.0.mix.spike.alpha":[768],"blocks.0.mix.spike.calibrated":[],"blocks.0.mix.spike.ema_rate":[768],"blocks.0.mix.spike.norm_w":[768],"blocks.0.mix.wo.weight":[384,768],"blocks.0.mlp.w_up":[311,384,192],"blocks.0.mlp.w_down":[311,192,384],"blocks.0.mlp.pending":[311],"blocks.0.mlp.pending_elig":[311],"blocks.0.mlp.bias":[311],"blocks.0.mlp.debt":[311],"blocks.0.mlp.load_ema":[311],"blocks.0.mlp.age":[311],"blocks.0.mlp.nmask":[311,192],"blocks.0.mlp.shared.ramp":[384],"blocks.0.mlp.shared.util":[384],"blocks.0.mlp.shared.up.weight":[384,384],"blocks.0.mlp.shared.spike.alpha":[384],"blocks.0.mlp.shared.spike.calibrated":[],"blocks.0.mlp.shared.spike.ema_rate":[384],"blocks.0.mlp.shared.spike.norm_w":[384],"blocks.0.mlp.shared.down.weight":[384,384],"blocks.0.mlp.router.weight":[311,384],"blocks.0.mlp.router_s.weight":[311,64],"blocks.0.mlp.spike_e.alpha":[59712],"blocks.0.mlp.spike_e.calibrated":[],"blocks.0.mlp.spike_e.ema_rate":[59712],"blocks.0.mlp.spike_e.norm_w":[59712],"blocks.0.w_0.weight":[1024,384],"blocks.0.n_c.weight":[384],"blocks.0.w_wv.weight":[1024,384],"blocks.0.w_wg.weight":[16,384],"blocks.0.w_wg.bias":[16],"blocks.0.w_rq.weight":[64,384],"blocks.0.w_ro.weight":[384,64],"blocks.0.w_xo.weight":[384,1024],"blocks.0.n_s.weight":[64],"normf.weight":[384],"heads.lm.weight":[16384,384],"halt_head.0.w y is 16,384 (checkpoint cfg); the tokenizer's name (e.g. 'wiki16k') was not checked.","The pass ring shows the eval loop (K = 6, head-group offset 0); training draws K and the offset per step."]}</script>

<script>
/* ===================== app core (classic script: works without the CDN) ===================== */
(function () {
  "use strict";
  const spec = JSON.parse(document.getElementById("brain-spec").textContent);
  const byId = Object.fromEntries(spec.nodes.map(n => [n.id, n]));
  const LAYERS = ["input", "forward", "memory", "output"];
  const KINDS = ["forward", "loop", "memory", "loss"];
  const state = {
    selected: null, view: "3d", layers: Object.fromEntries(LAYERS.map(l => [l, true])),
    back: true, anim: true, allShapes: false, flow: null, theme: "dark",
  };
  const listeners = [];
  let three = null;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  /* ---------- visibility & flows ---------- */
  function nodeVisible(n) { return state.layers[n.layer]; }
  function edgeVisible(e) {
    const a = byId[e.source], b = byId[e.target];
    if (!nodeVisible(a) || !nodeVisible(b)) return false;
    if (e.kind === "loss" && !state.back) return false;
    return true;
  }
  const PASS_NODES = new Set(["input_mix", "ws_read", "membranes", "waves", "router", "experts", "shared_expert",
    "ws_write", "x_update", "concepts", "uncertainty", "write_back", "private_mem"]);
  const FLOWS = {
    pass: { label: "One pass", edge: e => e.kind === "forward" && PASS_NODES.has(e.source) && PASS_NODES.has(e.target) },
    loop: { label: "Loop back", edge: e => e.kind === "loop" },
    memory: { label: "Memory path", edge: e => e.kind === "memory" || (e.kind === "loop" && byId[e.source].layer === "memory") },
    loss: { label: "Loss terms", edge: e => e.kind === "loss" },
  };
  function flowSets() {
    if (!state.flow) return null;
    const f = FLOWS[state.flow], E = new Set(), N = new Set();
    for (const e of spec.edges) if (f.edge(e)) { E.add(e.id); N.add(e.source); N.add(e.target); }
    return { E, N };
  }
  function selectionSets() {
    if (!state.selected) return null;
    const E = new Set(), N = new Set([state.selected]);
    for (const e of spec.edges) if (e.source === state.selected || e.target === state.selected) { E.add(e.id); N.add(e.source); N.add(e.target); }
    return { E, N };
  }
  function emphasis() { return selectionSets() || flowSets(); }

  /* ---------- API ---------- */
  const App = window.BrainApp = {
    spec, byId, state, nodeVisible, edgeVisible, emphasis, cssVar,
    on(fn) { listeners.push(fn); },
    emit(what) { for (const fn of listeners) try { fn(what); } catch (err) { console.error(err); } render2D(what); },
    select(id, opts = {}) {
      state.selected = id && byId[id] ? id : null;
      if (state.selected) { state.flow = null; syncFlowBtns(); }
      renderPanel(); App.emit("select");
      if (state.selected && opts.fly !== false && three) three.flyTo(state.selected);
      if (state.selected && opts.fly !== false) center2D(state.selected);
    },
    register3D(obj) { three = obj; clearTimeout(fallbackTimer); $("fallback").style.display = "none"; three.refresh("all"); },
  };

  /* ---------- header controls ---------- */
  const lt = $("layerToggles");
  for (const l of LAYERS) {
    const lab = document.createElement("label"); lab.className = "tog";
    lab.innerHTML = `<input type="checkbox" checked data-layer="${l}"><span class="dot" style="background:var(--c-${l})"></span>${{ input: "inputs", forward: "core", memory: "memory", output: "outputs + loss" }[l]}`;
    lt.appendChild(lab);
  }
  lt.addEventListener("change", ev => { const l = ev.target.dataset.layer; if (l) { state.layers[l] = ev.target.checked; App.emit("vis"); } });
  $("togBack").onchange = ev => { state.back = ev.target.checked; App.emit("vis"); };
  $("togAnim").onchange = ev => { state.anim = ev.target.checked; App.emit("anim"); };
  $("togShapes").onchange = ev => { state.allShapes = ev.target.checked; App.emit("vis"); };
  const fb = $("flowBtns");
  for (const [k, f] of Object.entries(FLOWS)) {
    const b = document.createElement("button"); b.className = "btn"; b.textContent = f.label; b.dataset.flow = k;
    b.onclick = () => { state.flow = state.flow === k ? null : k; state.selected = null; renderPanel(); syncFlowBtns(); App.emit("select"); };
    fb.appendChild(b);
  }
  function syncFlowBtns() { for (const b of fb.querySelectorAll("button")) b.classList.toggle("on", b.dataset.flow === state.flow); }
  $("resetBtn").onclick = () => { state.flow = null; syncFlowBtns(); App.select(null); if (three) three.reset(); reset2D(); };
  $("themeBtn").onclick = () => {
    state.theme = state.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = state.theme;
    $("themeBtn").textContent = state.theme === "dark" ? "Light" : "Dark";
    try { localStorage.setItem("brain3d-theme", state.theme); } catch (e) {}
    App.emit("theme");
  };
  try { if (localStorage.getItem("brain3d-theme") === "light") $("themeBtn").click(); } catch (e) {}
  function setView(v) {
    state.view = v;
    $("tab3d").classList.toggle("on", v === "3d"); $("tab2d").classList.toggle("on", v === "2d");
    $("view3d").style.display = v === "3d" ? "block" : "none"; $("view2d").style.display = v === "2d" ? "block" : "none";
    if (v === "2d") { build2D(); if (state.selected) center2D(state.selected); }
    App.emit("view");
  }
  $("tab3d").onclick = () => setView("3d"); $("tab2d").onclick = () => setView("2d");
  function fitHeader() { document.documentElement.style.setProperty("--hdr", $("hdr").offsetHeight + "px"); }
  new ResizeObserver(fitHeader).observe($("hdr")); fitHeader();

  /* ---------- legend + run info ---------- */
  const kindNames = spec.edge_kinds;
  $("legendBody").innerHTML =
    LAYERS.map(l => `<div class="row"><span class="dot" style="background:var(--c-${l})"></span>${esc(spec.layers[l])}</div>`).join("") +
    "<h4 style='margin-top:6px'>Edges</h4>" +
    KINDS.map(k => `<div class="row"><span class="sw ${k === "disabled" ? "dash" : ""}" style="border-color:var(--e-${k})"></span>${esc(kindNames[k])}</div>`).join("") +
    "<div class='hint' style='margin-top:6px;color:var(--muted)'>Drag to orbit, wheel to zoom, right-drag to pan. Click a module for details.</div>";
  if (innerHeight < 800 || innerWidth < 820) { $("legend").classList.add("min"); $("legendToggle").textContent = "show"; }
  $("legendToggle").onclick = () => { const l = $("legend"); l.classList.toggle("min"); $("legendToggle").textContent = l.classList.contains("min") ? "show" : "hide"; };
  const R = spec.run;
  $("runinfo").innerHTML = `<b>${esc(R.name)}</b> · ${R.steps.toLocaleString()} steps · B=16 T=512 d=384 V=16,384<br>` +
    `params ${(R.params.start / 1e6).toFixed(2)}M → ${(R.params.final / 1e6).toFixed(2)}M (+${(R.params.emb / 1e6).toFixed(2)}M emb)<br>` +
    `shapes from last.pt @ step ${R.checkpoint_step}: ${esc(spec.stages.ckpt.split(": ")[1])}`;

  /* ---------- side panel ---------- */
  const fmtN = n => n == null ? "" : Number(n).toLocaleString();
  function navBtn(id) { const n = byId[id]; return `<button class="btn" data-go="${id}" style="border-color:var(--c-${n.layer})">${esc(n.name)}</button>`; }
  function renderPanel() {
    const p = $("panel"), body = $("panelBody");
    const n = state.selected && byId[state.selected];
    if (!n) { p.classList.remove("open"); return; }
    let h = `<h2>${esc(n.name)}</h2><span class="badge" style="background:var(--c-${n.layer})">${esc(spec.layers[n.layer])}</span>`;
    if (n.notes) h += `<span class="badge" style="background:var(--c-disabled)">${esc(n.notes)}</span>`;
    h += `<h3>What it does</h3><p>${esc(n.purpose)}</p>`;
    if (n.equations && n.equations.length) h += `<h3>Key equations</h3><div class="eq">${n.equations.map(esc).join("\n")}</div>`;
    const rows = [];
    if (n.param_count) {
      const pc = n.param_count;
      rows.push(["trainable params", pc.start === pc.final ? fmtN(pc.start) : `${fmtN(pc.start)} (start) → ${fmtN(pc.ckpt)} (step ${R.checkpoint_step}) → ${fmtN(pc.final)} (final)`]);
    }
    for (const [k, v] of n.sizes || []) rows.push([k, v]);
    if (n.vram) rows.push(["VRAM", n.vram]);
    if (rows.length) h += `<h3>Parameters / sizes</h3><table class="kv">${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>`;
    const io = (list, dir) => list.map(x => {
      const other = dir === "in" ? x.from : x.to;
      return `<div class="io"><span class="k" style="color:var(--e-${x.kind})">${esc(x.kind)}</span>${dir === "in" ? "from" : "to"} <a data-go="${other}">${esc(x.name)}</a>` +
        (x.label ? ` · ${esc(x.label)}` : "") + (x.shape_sym ? `<code>${esc(x.shape_sym)} = ${esc(x.shape_num)}</code>` : "") + "</div>";
    }).join("");
    h += `<h3>Inputs (${n.inputs.length})</h3>${io(n.inputs, "in") || "<p style='color:var(--muted)'>none</p>"}`;
    h += `<h3>Outputs (${n.outputs.length})</h3>${io(n.outputs, "out") || "<p style='color:var(--muted)'>none</p>"}`;
    if (n.flags && n.flags.length) h += `<h3>Flags in this run</h3><table class="kv">${n.flags.map(([k, v]) => `<tr><td><code>${esc(k)}</code></td><td>${esc(v)}</td></tr>`).join("")}</table>`;
    if (n.code && n.code.length) h += `<h3>Code</h3>${n.code.map(c => `<code class="file">${esc(c)}</code>`).join("")}`;
    h += `<h3>Previous modules</h3><div class="navbtns">${n.prev.map(navBtn).join("") || "<span style='color:var(--muted)'>none</span>"}</div>`;
    h += `<h3>Next modules</h3><div class="navbtns">${n.next.map(navBtn).join("") || "<span style='color:var(--muted)'>none</span>"}</div>`;
    body.innerHTML = h; p.classList.add("open"); p.scrollTop = 0;
  }
  $("panelBody").addEventListener("click", ev => { const t = ev.target.closest("[data-go]"); if (t) App.select(t.dataset.go); });
  $("panelClose").onclick = () => App.select(null, { fly: false });

  /* ---------- search ---------- */
  const sIn = $("search"), sRes = $("results");
  let hits = [], act = 0;
  function doSearch() {
    const q = sIn.value.trim().toLowerCase();
    if (!q) { sRes.style.display = "none"; return; }
    hits = spec.nodes.map(n => {
      const hay = [n.id, n.name, n.purpose, (n.flags || []).map(f => f.join(" ")).join(" "), (n.code || []).join(" ")].join(" ").toLowerCase();
      const score = n.name.toLowerCase().includes(q) ? 3 : n.id.includes(q) ? 2 : hay.includes(q) ? 1 : 0;
      const flag = (n.flags || []).find(f => String(f[0]).toLowerCase().includes(q));
      return { n, score, flag };
    }).filter(x => x.score).sort((a, b) => b.score - a.score).slice(0, 14);
    act = 0;
    sRes.innerHTML = hits.map((x, i) => `<div data-i="${i}" class="${i === 0 ? "act" : ""}">${esc(x.n.name)}<small>${esc(spec.layers[x.n.layer])}${x.flag ? " · " + esc(x.flag[0]) + " = " + esc(x.flag[1]) : ""}</small></div>`).join("") || "<div>no match</div>";
    sRes.style.display = "block";
  }
  sIn.addEventListener("input", doSearch);
  sIn.addEventListener("keydown", ev => {
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      act = Math.max(0, Math.min(hits.length - 1, act + (ev.key === "ArrowDown" ? 1 : -1)));
      [...sRes.children].forEach((c, i) => c.classList.toggle("act", i === act)); ev.preventDefault();
    } else if (ev.key === "Enter" && hits[act]) { App.select(hits[act].n.id); sRes.style.display = "none"; sIn.blur(); }
    else if (ev.key === "Escape") { sRes.style.display = "none"; }
  });
  sRes.addEventListener("mousedown", ev => { const d = ev.target.closest("[data-i]"); if (d) { App.select(hits[+d.dataset.i].n.id); sRes.style.display = "none"; } });
  sIn.addEventListener("blur", () => setTimeout(() => sRes.style.display = "none", 150));
  document.addEventListener("keydown", ev => {
    if (ev.key === "/" && document.activeElement !== sIn) { sIn.focus(); ev.preventDefault(); }
    if (ev.key === "Escape" && document.activeElement !== sIn) App.select(null, { fly: false });
  });

  /* ---------- walkthrough ---------- */
  let wi = 0, wTimer = null;
  const W = spec.walkthrough;
  function walkShow() {
    const s = W[wi];
    $("walkTxt").innerHTML = `<b>${esc(byId[s.node].name)}</b> — ${esc(s.text)}`;
    $("walkStep").textContent = `step ${wi + 1} / ${W.length}`;
    App.select(s.node);
  }
  function walkStop() { clearInterval(wTimer); wTimer = null; $("walkPlay").textContent = "Play"; }
  $("walkBtn").onclick = () => { $("walk").style.display = "block"; wi = 0; walkShow(); };
  $("walkNext").onclick = () => { wi = Math.min(W.length - 1, wi + 1); walkShow(); };
  $("walkPrev").onclick = () => { wi = Math.max(0, wi - 1); walkShow(); };
  $("walkClose").onclick = () => { walkStop(); $("walk").style.display = "none"; };
  $("walkPlay").onclick = () => {
    if (wTimer) return walkStop();
    $("walkPlay").textContent = "Pause";
    wTimer = setInterval(() => { if (wi >= W.length - 1) return walkStop(); wi++; walkShow(); }, 3800);
  };

  /* ---------- 2D overview (SVG, no dependencies) ---------- */
  const NS = "http://www.w3.org/2000/svg";

  App.register3D({ flyTo, reset, refresh });
}
